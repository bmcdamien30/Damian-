<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
{{FONTS_CSS}}
/* Layout: one centered 9:16 paper stage on an ink-blue desk, controls under it. */
:root {
  --desk: #191838;
  --desk-2: #24234a;
  --paper: #fbf6ea;
  --muted: #b8b2d6;
  --sun: #ffc928;
  --tomato: #ef4130;
  --ink: #1d1a22;
  --display: "PStencil", Impact, "Arial Narrow Bold", sans-serif;
  --body: "PHead", "Arial Black", Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--paper);
  font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 {
  font-family: var(--display); font-weight: 900; font-size: clamp(34px, 9vw, 52px);
  line-height: .95; margin: 0; letter-spacing: .01em; text-wrap: balance; color: var(--sun);
}
h1 span { color: var(--paper); }
.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 9 / 16;
  background: var(--desk-2); border-radius: 6px; overflow: hidden;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
.stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage img { object-fit: cover; }
.note {
  position: absolute; left: 12px; right: 12px; bottom: 12px; margin: 0;
  background: var(--paper); color: var(--ink); font-size: 13px; line-height: 1.35;
  padding: 8px 10px; border-radius: 3px; font-family: Arial, sans-serif;
}
.bar { display: flex; align-items: center; gap: 10px; }
button {
  font-family: var(--body); font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  background: var(--sun); color: var(--ink); border: 0; border-radius: 3px; padding: 9px 14px; cursor: pointer; min-width: 84px;
}
button:focus-visible, input:focus-visible { outline: 3px solid var(--paper); outline-offset: 2px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--tomato); }
.time { font-family: Arial, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 74px; text-align: right; }
.sources { font-family: Arial, sans-serif; font-size: 12.5px; line-height: 1.5; color: var(--muted); margin: 0; }
.sources a { color: var(--paper); }
</style>
</head>
<body>
<div class="wrap">
  <h1>{{HEADLINE}}</h1>
  <div class="stage" id="stage">
    {{POSTER}}
    <canvas id="cv" aria-label="{{TITLE}} animation"></canvas>
  </div>
  <div class="bar">
    <button id="play" type="button">Pause</button>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
  <p class="sources">{{SOURCES}}</p>
</div>
<script>
{{ENGINE}}
</script>
<script>
{{CHARACTER}}
</script>
<script>
(async function () {
  const canvas = document.getElementById('cv');
  const REC = !!window.__RECORD;
  try {
    await Promise.all(['900 100px "PStencil"', '700 100px "PStencil7"', '100px "PHead"', '100px "PHand"'].map((f) => document.fonts.load(f)));
  } catch (e) {}
  PE.res = REC ? (window.__RES || 1) : 0.5;
  // ---- story ----
{{STORY}}
  // ---- player ----
  window.__READY = true;
  if (REC) return;
  const poster = document.getElementById('poster');
  const note = document.getElementById('posterNote');
  if (note) note.hidden = true;
  const btn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const fmt = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let playing = !reduce, t = reduce ? 2 : 0, last = performance.now(), dragging = false;
  btn.textContent = playing ? 'Pause' : 'Play';
  btn.addEventListener('click', () => { playing = !playing; btn.textContent = playing ? 'Pause' : 'Play'; last = performance.now(); });
  scrub.addEventListener('input', () => { dragging = true; t = (scrub.value / 1000) * PE.duration; draw(); });
  scrub.addEventListener('change', () => { dragging = false; last = performance.now(); });
  function draw() {
    PE.render(t, 1);
    if (poster) poster.hidden = true;
    time.textContent = fmt(t) + ' / ' + fmt(PE.duration);
    if (!dragging) scrub.value = Math.round((t / PE.duration) * 1000);
  }
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing && !dragging) { t += dt; if (t >= PE.duration) t = 0; }
    if (playing || dragging) draw();
    requestAnimationFrame(loop);
  }
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
